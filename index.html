<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All-in-One Fantasy Dashboard</title>
<style>
  :root{--bg:#0b0f16;--bg2:#111722;--card:#161d2a;--card2:#1d2636;--ink:#f2f6fb;--mut:#8f9cb0;
        --line:#28313f;--grn:#33e08a;--red:#ff6060;--yel:#ffd23f;--blu:#4aa8ff;--vio:#b878ff;--gold:#ffcf3f;}
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{padding:16px;text-align:center;background:linear-gradient(180deg,#121a26,#0c1119);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
  .wrap{max-width:900px;margin:0 auto;padding:14px}

  .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .tabs .tab{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;
       font-size:13.5px;font-weight:800;color:var(--mut);background:#0d131c;border:1px solid var(--line)}
  .tabs .tab.active{color:#04121f;background:var(--blu);border-color:var(--blu)}
  .tabs .tab.soon{opacity:.45}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .lg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .lg-name{font-size:17px;font-weight:800}
  .lg-meta{color:var(--mut);font-size:12px}
  .lg-rec{font-size:13px;font-weight:800;color:var(--blu);white-space:nowrap}
  .badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;
         background:rgba(255,207,63,.16);color:var(--gold);border:1px solid var(--gold);margin-left:6px;vertical-align:middle}

  /* view toggle within a league card */
  .vtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .vtabs button{flex:0 0 auto;padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;
       background:#0d131c;border:1px solid var(--line);color:var(--mut);min-height:38px}
  .vtabs button.on{background:var(--blu);border-color:var(--blu);color:#04121f}
  .vpane{display:none} .vpane.on{display:block}

  /* matchup strip */
  .mu{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
      background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:12px 0}
  .mu-side{min-width:0}
  .mu-side.me .mu-team{color:var(--grn)}
  .mu-team{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-sub{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-pts{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .mu-side.right{text-align:right}
  .mu-vs{color:var(--mut);font-size:11px;font-weight:800;text-align:center}
  .mu-lead .mu-pts{color:var(--grn)}

  .sh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:800;margin:14px 0 8px}
  .grp-n{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;background:#0d131c;border:1px solid var(--line);color:var(--mut);font-size:10px;font-weight:800}
  /* All-My-Players expandable row: tap to see which leagues (priority order) */
  .pl-d{border-radius:9px}
  .pl-d>summary{cursor:pointer;list-style:none}
  .pl-d>summary::-webkit-details-marker{display:none}
  .pl-d[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .pl-caret{display:inline-block;color:var(--mut);font-size:10px;transition:transform .15s;margin-left:2px}
  .pl-d[open] .pl-caret{transform:rotate(180deg)}
  .pl-body{display:flex;flex-direction:column;gap:4px;padding:8px 12px 10px 12px;
           background:var(--bg);border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px;margin-top:-3px}
  .pl-lg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .pl-start{font-size:10px;font-weight:800;color:var(--grn);background:rgba(51,224,138,.12);border:1px solid var(--grn);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .pl-bench{font-size:10px;font-weight:800;color:var(--mut);background:#0d131c;border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
  /* game status chip in the AMP meta line */
  .gst{font-weight:800;white-space:nowrap}
  .gst.pre{color:var(--mut)}
  .gst.live{color:#ff6060}
  .gst.final{color:var(--grn)}
  .gst.tbd{color:var(--mut);opacity:.8}
  .pl-d.is-played>summary{opacity:.62}
  /* AMP header: week label + upcoming-only toggle */
  .amp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .amp-wk{font-size:15px;font-weight:800;color:var(--txt)}
  .amp-sub{font-size:12px;font-weight:600;color:var(--mut)}
  .amp-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;user-select:none}
  .amp-toggle input{accent-color:var(--grn);cursor:pointer}
  .roster{display:flex;flex-direction:column;gap:3px}
  .pl{display:grid;grid-template-columns:46px 28px 1fr auto;gap:10px;align-items:center;
      padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
  .pl.bench{background:transparent;border-color:transparent;padding:5px 10px}
  .slot{font-size:10px;font-weight:800;color:var(--mut);text-align:center;background:#0d131c;
        border:1px solid var(--line);border-radius:6px;padding:3px 2px}
  .slot.FLEX,.slot.SUPER_FLEX,.slot.IDP_FLEX,.slot.WRRB_FLEX,.slot.REC_FLEX{color:var(--yel)}
  .slot.BN{color:var(--mut);opacity:.7} .slot.IR,.slot.TAXI{color:var(--red);opacity:.85}
  .pname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pmeta{color:var(--mut);font-size:11px;font-weight:600}
  .ppos{font-size:11px;font-weight:800;color:var(--mut);white-space:nowrap}
  .psal{font-size:12px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  .psal.verify{color:var(--mut)}
  .pos-QB{color:#f0913e}.pos-RB{color:#33e08a}.pos-WR{color:#4aa8ff}.pos-TE{color:#b878ff}
  .pos-K{color:#95a5a6}.pos-DEF{color:#ff6060}.pos-DL{color:#e0679a}.pos-LB{color:#67c7e0}.pos-DB{color:#c7e067}
  .empty-slot{color:var(--mut);font-style:italic;font-size:13px}
  /* player image: headshot, team-logo fallback, or initial. 28px round.
     Logo variant sits on a white chip so dark team marks stay readable (picks-site pattern). */
  .pimg-wrap{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px}
  .pimg{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:top center;background:#0d131c;display:block}
  .pimg.is-logo{object-fit:contain;background:#fff;padding:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .pimg-fb{width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;
           font-size:13px;font-weight:800;background:#0d131c;border:1px solid var(--line)}

  /* standings + all-teams */
  .stand{display:flex;flex-direction:column;gap:4px}
  .st-row{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;
          padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:13px}
  .st-row.me{border-color:var(--grn);background:rgba(51,224,138,.06)}
  .st-rk{color:var(--mut);font-weight:800;text-align:center}
  .st-team{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .st-sub{color:var(--mut);font-weight:600;font-size:11px}
  .st-rec{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
  .st-pf{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

  details.tm{background:var(--bg);border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
  details.tm>summary{cursor:pointer;list-style:none;padding:9px 11px;display:grid;
       grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;font-size:13px}
  details.tm>summary::-webkit-details-marker{display:none}
  details.tm.me{border-color:var(--grn)}
  details.tm .tmbody{padding:0 11px 10px}

  /* analyzer */
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:800}
  .stat .v{font-size:16px;font-weight:800;margin-top:3px}
  .stat .d{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4}
  .stat.me{border-color:var(--grn)}
  .stat.flag{border-color:var(--yel)}
  .an-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted rgba(40,49,63,.5);font-size:13px}
  .an-row:last-child{border-bottom:none}
  .an-row .lab{color:var(--mut)} .an-row .val{font-weight:800;font-variant-numeric:tabular-nums}
  .an-note{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:8px}
  .an-skip{font-size:11.5px;color:var(--mut);background:var(--bg);border:1px dashed var(--line);
           border-radius:9px;padding:9px 11px;margin-top:10px}
  .an-skip b{color:var(--ink)}
  .capbar{height:8px;border-radius:5px;background:#0d131c;border:1px solid var(--line);overflow:hidden;margin-top:5px}
  .capbar .fill{height:100%;background:linear-gradient(90deg,var(--grn),var(--yel))}
  .capbar .fill.over{background:var(--red)}

  details.more{margin-top:6px}
  details.more>summary{cursor:pointer;color:var(--blu);font-size:12.5px;font-weight:800;list-style:none;padding:4px 0}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::after{content:" ▾"}
  details.more[open]>summary::after{content:" ▴"}

  .note{color:var(--mut);font-size:11.5px;text-align:center;margin:6px 0}
  .err{background:rgba(255,96,96,.12);border:1px solid var(--red);color:var(--ink);
       padding:12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .loading{color:var(--mut);text-align:center;padding:30px;font-size:14px}

  @media (max-width:640px){
    .wrap{padding:10px}
    h1{font-size:17px}
    .card{padding:12px}
    .lg-name{font-size:16px}
    .mu-team{font-size:12.5px}.mu-pts{font-size:19px}
    .pl{grid-template-columns:42px 26px 1fr auto;gap:8px;padding:6px 8px}
    .pimg-wrap,.pimg,.pimg-fb{width:26px;height:26px;flex-basis:26px}
    .pname{font-size:13.5px}
    .st-row{font-size:12.5px}
    .tabs .tab{padding:9px 14px}
    .an-grid{grid-template-columns:1fr}
    details.tm>summary{grid-template-columns:20px 1fr auto auto;gap:8px}
  }
</style>
</head>
<body>
<header>
  <h1>🏈 All-in-One Fantasy Dashboard</h1>
  <div class="sub" id="subhead">Loading…</div>
  <nav class="tabs">
    <span class="tab active">🟢 Sleeper</span>
    <span class="tab active">🔴 ESPN</span>
    <span class="tab soon" title="Coming in a later phase (serverless OAuth)">Yahoo · soon</span>
  </nav>
</header>

<div class="wrap">
  <div id="errbox"></div>
  <div id="leagues"><div class="loading">Loading your Sleeper leagues…</div></div>
  <div class="note" id="foot"></div>
</div>

<script>
/* ============================================================================
   ALL-IN-ONE FANTASY DASHBOARD — Phase 1: SLEEPER (public API, no auth).
   Static site (GitHub Pages). Provider abstraction lets ESPN + Yahoo slot in
   as later phases via a serverless backend (secrets server-side, never here).
   ============================================================================ */

const CONFIG = {
  sleeper: {
    username: "JunceBoxes",
    season: "2026",
    leagueOrder: ["1396295869136932864","1386766016129818624","1372256037666574336"],
    // leagues that use an auction salary cap -> show per-player $ + team cap totals
    salaryLeagues: { "1372256037666574336": { cap: 365, floor: 1 } },
  },
  espn: {
    enabled: true,
    season: "2026",
    // The dashboard NEVER holds the cookie. It calls this serverless proxy, which reads the
    // cookie from Vercel env vars server-side and returns only data. On the Vercel deploy this
    // is same-origin ("/api/espn"); the GitHub Pages copy falls back to the absolute vercel URL.
    apiBase: (location.hostname.endsWith("vercel.app") || location.hostname==="localhost")
      ? "/api/espn"
      : "https://fantasy-dashboard-orpin.vercel.app/api/espn",   // real Vercel production domain (verified live 2026-08-13)
    leagues: [
      { id:"963488",     team:5,  name:"Royal Crushers" },
      { id:"484087929",  team:12, name:"Dargelong" },
      { id:"764639655",  team:8,  name:"2QB / Winona" },
      { id:"175994",     team:4,  name:"6-man" },
      { id:"1910409336", team:5,  name:"CAN AM" },
      { id:"771790710",  team:2,  name:"Uncle and Boys" },
    ],
  },
  yahoo: { enabled:false /* Phase 3: OAuth -> serverless */ },
};

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(url.split("/v1/")[1] + " → HTTP " + r.status);
  return r.json();
}
// generic fetch (used by the ESPN proxy, which returns 200 + {error:...} for auth issues)
async function getJSONraw(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

/* ============================================================================
   PROVIDER ABSTRACTION — each provider.load() returns normalized leagues:
     { provider, leagueId, name, seasonWeek, roster_positions, salary?,
       me:{...}, matchup:{...}, standings:[...], teams:[...], analyzer:{...} }
   ============================================================================ */
const providers = {};

providers.sleeper = (function(){
  const API = "https://api.sleeper.app/v1";
  const PK="sleeper_players_nfl_v2", TK="sleeper_players_nfl_ts", TTL=1000*60*60*24;  // v2: slim cache now carries espn_id (e) for headshots

  async function loadPlayers(){
    try{ const ts=+(localStorage.getItem(TK)||0), c=localStorage.getItem(PK);
      if(c && (Date.now()-ts)<TTL) return JSON.parse(c); }catch(e){}
    const players = await getJSON(API+"/players/nfl");
    const slim={};
    for(const id in players){ const p=players[id]; if(!p) continue;
      slim[id]={ n:p.full_name||((p.first_name||"")+" "+(p.last_name||"")).trim()||id, p:p.position||"", t:p.team||"", e:p.espn_id||"" }; }
    try{ localStorage.setItem(PK,JSON.stringify(slim)); localStorage.setItem(TK,String(Date.now())); }catch(e){}
    return slim;
  }
  function resolvePlayer(pmap,id){ if(!id||id==="0"||id===0) return null;
    const p=pmap[id]; return p?{id,name:p.n,pos:p.p,team:p.t,espnId:p.e||""}:{id,name:String(id),pos:"",team:"",espnId:""}; }
  function teamNameOf(u){ return u ? ((u.metadata&&u.metadata.team_name)||u.display_name||"Team") : "Unknown"; }
  function ownerNameOf(u){ return u ? (u.display_name||"?") : "?"; }
  const fptsOf = r => (r.settings.fpts||0) + (r.settings.fpts_decimal? r.settings.fpts_decimal/100 : 0);
  const paOf   = r => (r.settings.fpts_against||0) + (r.settings.fpts_against_decimal? r.settings.fpts_against_decimal/100 : 0);

  // ---- salary map (auction leagues): player_id -> $amount.
  // Dynasty carryover: a player's price may come from THIS season's offseason auction OR an
  // earlier initial auction. Merge ALL auction drafts (newest wins on conflict) so kept players
  // keep their real price and only true pickups/undrafted fall to the $1 floor. ----
  async function loadSalaries(leagueId){
    try{
      const drafts = await getJSON(`${API}/league/${leagueId}/drafts`);
      if(!drafts || !drafts.length) return null;
      const auctions = drafts.filter(d=>d.type==="auction");
      if(!auctions.length) return null;
      // sort OLDEST first so newer prices overwrite older ones
      auctions.sort((a,b)=>(a.start_time||0)-(b.start_time||0));
      const map = {};
      for(const d of auctions){
        const picks = await getJSON(`${API}/draft/${d.draft_id}/picks`).catch(()=>[]);
        picks.forEach(p=>{ const amt=p.metadata && p.metadata.amount;
          if(p.player_id!=null && amt!=null && amt!=="") map[String(p.player_id)] = parseInt(amt,10); });
      }
      return map;
    }catch(e){ return null; }
  }

  // ---- transactions across weeks 1..current (FAAB / adds / trades) ----
  async function loadTransactions(leagueId, week){
    const all=[];
    const weeks=[]; for(let w=1; w<=Math.max(1,week); w++) weeks.push(w);
    const results = await Promise.all(weeks.map(w=>getJSON(`${API}/league/${leagueId}/transactions/${w}`).catch(()=>[])));
    results.forEach(list=>{ if(Array.isArray(list)) list.forEach(t=>all.push(t)); });
    return all;
  }

  // build a team object (roster + resolved starters/bench + optional salary)
  function buildTeam(r, roster_positions, usersById, pmap, salaryMap, salaryCfg){
    const starterSlots = roster_positions.filter(p=>p!=="BN"&&p!=="IR"&&p!=="TAXI");
    const startIds = (r.starters||[]).map(String);
    const starters = (r.starters||[]).map((pid,i)=>({ slot: starterSlots[i]||"FLEX", player: resolvePlayer(pmap,pid) }));
    const startSet = new Set(startIds);
    const reserveSet = new Set([...(r.reserve||[]),...(r.taxi||[])].map(String));
    const bench = (r.players||[]).filter(pid=>!startSet.has(String(pid)))
      .map(pid=>({ player:resolvePlayer(pmap,pid), reserve:reserveSet.has(String(pid)) })).filter(x=>x.player);
    // salary
    let salary=null;
    if(salaryMap && salaryCfg){
      const priced = (r.players||[]).map(pid=>{
        const known = salaryMap[String(pid)]!=null;
        const amt = known ? salaryMap[String(pid)] : salaryCfg.floor;   // pickup/unknown -> floor $1
        return { pid:String(pid), amt, known };
      });
      const total = priced.reduce((s,x)=>s+x.amt,0);
      const salById = {}; priced.forEach(x=>salById[x.pid]={amt:x.amt,known:x.known});
      salary = { total, cap:salaryCfg.cap, byId:salById, unknownCount: priced.filter(x=>!x.known).length };
    }
    const u=usersById[r.owner_id];
    return {
      roster_id:r.roster_id, owner:ownerNameOf(u), teamName:teamNameOf(u),
      record:{ w:r.settings.wins||0, l:r.settings.losses||0, t:r.settings.ties||0 },
      pf:fptsOf(r), pa:paOf(r), moves:r.settings.total_moves||0, faabUsed:r.settings.waiver_budget_used||0,
      starters, bench, salary, players:(r.players||[]).map(String),
    };
  }

  /* ---- ANALYZER: lineup shapes, transactions/FAAB, scoring, my-team-vs-league.
     All derived from real fields; anything the API can't support is listed in `skips`. ---- */
  function analyze(teams, matchups, roster_positions, transactions, week, mineRosterId, faabBudget){
    const skips=[];
    // count starter positions per team (lineup shape). Uses roster_positions labels via slot.
    const posOf = s => s.player ? s.player.pos : "";
    const shapes = teams.map(t=>{
      const c={};
      t.starters.forEach(s=>{ const p=posOf(s); if(p) c[p]=(c[p]||0)+1; });
      const shapeKey = ["QB","RB","WR","TE","K","DEF","DL","LB","DB"].filter(p=>c[p]).map(p=>c[p]+p).join(" ");
      return { roster_id:t.roster_id, teamName:t.teamName, counts:c, shapeKey, isMe:t.roster_id===mineRosterId };
    });
    // most common shape + flag teams that deviate
    const shapeCounts={}; shapes.forEach(s=>shapeCounts[s.shapeKey]=(shapeCounts[s.shapeKey]||0)+1);
    const commonShape = Object.entries(shapeCounts).sort((a,b)=>b[1]-a[1])[0];
    const unusual = shapes.filter(s=>shapeCounts[s.shapeKey]===1 && shapes.length>2);

    // per-position "who starts the most X" quirks (e.g. only team starting 2 TE)
    const quirks=[];
    ["QB","RB","WR","TE","K","DL","LB","DB"].forEach(pos=>{
      const withCount = shapes.map(s=>({t:s.teamName,isMe:s.isMe,n:s.counts[pos]||0}));
      const max=Math.max(...withCount.map(x=>x.n));
      const top=withCount.filter(x=>x.n===max && max>0);
      if(top.length===1 && max>=2){ quirks.push(`${top[0].t} is the only team starting ${max} ${pos}${top[0].isMe?" (you)":""}`); }
    });

    // scoring/matchup (only meaningful once games have points)
    let scoring=null;
    if(matchups && matchups.length){
      const played = matchups.some(m=>(m.points||0)>0);
      if(played){
        const byTeam = matchups.map(m=>{
          const t=teams.find(x=>x.roster_id===m.roster_id);
          const starterPts = (m.starters_points||[]).reduce((s,v)=>s+(v||0),0);
          const allPts = m.players_points ? Object.values(m.players_points).reduce((s,v)=>s+(v||0),0) : starterPts;
          const benchPts = Math.max(0, allPts - starterPts);
          return { teamName:t?t.teamName:("R"+m.roster_id), isMe:m.roster_id===mineRosterId,
                   points:m.points||0, benchPts };
        });
        byTeam.sort((a,b)=>b.points-a.points);
        scoring = {
          top: byTeam[0], low: byTeam[byTeam.length-1],
          mostOnBench: byTeam.slice().sort((a,b)=>b.benchPts-a.benchPts)[0],
          me: byTeam.find(x=>x.isMe) || null,
          all: byTeam,
        };
      }
    }

    // transactions / FAAB
    let tx=null;
    if(transactions){
      const done = transactions.filter(t=>t.status==="complete");
      const adds=done.filter(t=>t.type==="free_agent"||t.type==="waiver").length;
      const trades=done.filter(t=>t.type==="trade").length;
      const byRoster={};
      done.forEach(t=>(t.roster_ids||[]).forEach(rid=>byRoster[rid]=(byRoster[rid]||0)+1));
      // FAAB spent from roster settings (season-to-date) — reliable
      const faab = teams.map(t=>({teamName:t.teamName,isMe:t.roster_id===mineRosterId,spent:t.faabUsed,
                    left:(faabBudget!=null?faabBudget-t.faabUsed:null)}))
                    .sort((a,b)=>b.spent-a.spent);
      const busiest = teams.map(t=>({teamName:t.teamName,isMe:t.roster_id===mineRosterId,moves:t.moves}))
                    .sort((a,b)=>b.moves-a.moves)[0];
      tx = { totalMoves: done.length, adds, trades, faab, busiest, faabBudget };
    }

    // my-team-vs-league depth ranks
    let mine=null;
    if(mineRosterId!=null){
      const me = teams.find(t=>t.roster_id===mineRosterId);
      if(me){
        const rankBy=(key,dir)=>{ const arr=teams.slice().sort((a,b)=>dir*(b[key]-a[key]));
          return arr.findIndex(t=>t.roster_id===mineRosterId)+1; };
        // depth: count rostered players by position (bench + starters)
        const myShape = shapes.find(s=>s.roster_id===mineRosterId);
        mine = {
          pfRank: rankBy("pf",1), paRank: rankBy("pa",1),
          rosterSize: me.players.length, shape: myShape?myShape.shapeKey:"",
          movesRank: (teams.slice().sort((a,b)=>b.moves-a.moves).findIndex(t=>t.roster_id===mineRosterId)+1),
        };
      }
    }

    // record honest skips (things the API can't support / not yet meaningful)
    if(!scoring) skips.push("Scoring/boom-bust & points-left-on-bench: waiting on games to be played (Week "+week+" not scored yet).");
    skips.push("Trade win/loss grading & projections: not provided by Sleeper's API (would require external projections).");

    return { shapes, commonShape, unusual, quirks, scoring, tx, mine, skips, teamsCount:teams.length };
  }

  async function load(){
    const user = await getJSON(`${API}/user/${CONFIG.sleeper.username}`);
    const state = await getJSON(`${API}/state/nfl`).catch(()=>({week:1}));
    const week = state.week || 1;
    const [pmap, leaguesRaw] = await Promise.all([ loadPlayers(),
      getJSON(`${API}/user/${user.user_id}/leagues/nfl/${CONFIG.sleeper.season}`) ]);
    const order = CONFIG.sleeper.leagueOrder;
    const leagues = leaguesRaw.slice().sort((a,b)=>{
      const ia=order.indexOf(a.league_id), ib=order.indexOf(b.league_id); return (ia<0?99:ia)-(ib<0?99:ib); });

    const out=[];
    for(const lg of leagues){
      try{
        const salaryCfg = CONFIG.sleeper.salaryLeagues[lg.league_id] || null;
        const faabBudget = (lg.settings && lg.settings.waiver_budget!=null) ? lg.settings.waiver_budget : null;
        const [rosters, users, matchups, salaryMap, transactions] = await Promise.all([
          getJSON(`${API}/league/${lg.league_id}/rosters`),
          getJSON(`${API}/league/${lg.league_id}/users`),
          getJSON(`${API}/league/${lg.league_id}/matchups/${week}`).catch(()=>[]),
          salaryCfg ? loadSalaries(lg.league_id) : Promise.resolve(null),
          loadTransactions(lg.league_id, week),
        ]);
        const usersById={}; users.forEach(u=>usersById[u.user_id]=u);
        const rosterById={}; rosters.forEach(r=>rosterById[r.roster_id]=r);
        const mine = rosters.find(r=>r.owner_id===user.user_id) || rosters.find(r=>(r.co_owners||[]).includes(user.user_id));
        const roster_positions = lg.roster_positions || [];

        // ALL teams
        const teams = rosters.map(r=>buildTeam(r, roster_positions, usersById, pmap, salaryMap, salaryCfg));
        const myTeam = mine ? teams.find(t=>t.roster_id===mine.roster_id) : null;

        // matchup (mine)
        let matchup=null;
        if(mine && matchups && matchups.length){
          const myM=matchups.find(m=>m.roster_id===mine.roster_id);
          if(myM){ const oppM=matchups.find(m=>m.matchup_id===myM.matchup_id && m.roster_id!==mine.roster_id);
            const oppT = oppM ? teams.find(t=>t.roster_id===oppM.roster_id) : null;
            matchup={ me:{teamName:myTeam.teamName, points:myM.points||0},
                      opp: oppM?{teamName:oppT?oppT.teamName:"Opp", points:oppM.points||0}:null }; }
        }

        // standings
        const standings = teams.slice().sort((a,b)=>(b.record.w-a.record.w)||(b.pf-a.pf))
          .map((t,i)=>({ rank:i+1, teamName:t.teamName, owner:t.owner, w:t.record.w, l:t.record.l, t:t.record.t,
                         pf:t.pf, isMe: myTeam && t.roster_id===myTeam.roster_id }));

        const analyzer = analyze(teams, matchups, roster_positions, transactions, week,
                                 mine?mine.roster_id:null, faabBudget);

        out.push({
          provider:"sleeper", leagueId:lg.league_id, name:lg.name, seasonWeek:week, roster_positions,
          salary: salaryCfg ? { cap:salaryCfg.cap, floor:salaryCfg.floor, hasMap: !!salaryMap } : null,
          me: myTeam ? { teamName:myTeam.teamName, record:myTeam.record, pf:myTeam.pf, pa:myTeam.pa,
                         starters:myTeam.starters, bench:myTeam.bench, salary:myTeam.salary } : null,
          matchup, standings, teams, analyzer,
        });
      }catch(e){ out.push({ provider:"sleeper", leagueId:lg.league_id, name:lg.name, error:e.message }); }
    }
    return { week, out };
  }
  return { load };
})();

/* ---------- ESPN (Phase 2 — via Vercel serverless proxy; cookie stays server-side) ---------- */
providers.espn = (function(){
  // ESPN lineupSlotId -> label (subset). Unknown -> its id.
  const SLOT = {0:"QB",1:"TQB",2:"RB",3:"RB/WR",4:"WR",5:"WR/TE",6:"TE",7:"OP",8:"DT",9:"DE",
    10:"LB",11:"DL",12:"CB",13:"S",14:"DB",15:"DP",16:"D/ST",17:"K",18:"P",19:"HC",
    20:"BN",21:"IR",23:"FLEX",24:"ER"};
  const POS = {1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"DEF"};
  // ESPN proTeamId -> NFL abbrev (for player team + cross-league schedule matching)
  const PRO = {0:"FA",1:"ATL",2:"BUF",3:"CHI",4:"CIN",5:"CLE",6:"DAL",7:"DEN",8:"DET",9:"GB",10:"TEN",
    11:"IND",12:"KC",13:"LV",14:"LAR",15:"MIA",16:"MIN",17:"NE",18:"NO",19:"NYG",20:"NYJ",21:"PHI",
    22:"ARI",23:"PIT",24:"LAC",25:"SF",26:"SEA",27:"TB",28:"WSH",29:"CAR",30:"JAX",33:"BAL",34:"HOU"};

  function teamName(t){ return (t.name || `${t.location||""} ${t.nickname||""}`.trim() || ("Team "+t.id)); }
  const pf = t => (t.record && t.record.overall && t.record.overall.pointsFor) || 0;
  const pa = t => (t.record && t.record.overall && t.record.overall.pointsAgainst) || 0;
  const recOf = t => { const o=(t.record&&t.record.overall)||{}; return {w:o.wins||0,l:o.losses||0,t:o.ties||0}; };

  function playerOf(entry){
    const p = (entry.playerPoolEntry && entry.playerPoolEntry.player) || entry.player || {};
    const eid = String(p.id||entry.playerId||"");
    return { id:eid, name:p.fullName||("id "+(entry.playerId||"?")),
             pos: POS[p.defaultPositionId]||"", team: PRO[p.proTeamId]||"", espnId:eid };
  }
  function buildTeam(t, myTeamId){
    const entries = ((t.roster||{}).entries)||[];
    const starterSlots = entries.filter(e=>SLOT[e.lineupSlotId]!=="BN"&&SLOT[e.lineupSlotId]!=="IR");
    const benchEntries  = entries.filter(e=>SLOT[e.lineupSlotId]==="BN"||SLOT[e.lineupSlotId]==="IR");
    const starters = starterSlots.map(e=>({ slot: SLOT[e.lineupSlotId]||String(e.lineupSlotId), player: playerOf(e) }));
    const bench = benchEntries.map(e=>({ player: playerOf(e), reserve: SLOT[e.lineupSlotId]==="IR" }));
    return {
      roster_id: t.id, teamName: teamName(t), owner: teamName(t),
      record: recOf(t), pf: pf(t), pa: pa(t), moves: (t.transactionCounter&&t.transactionCounter.acquisitions)||0,
      faabUsed: (t.transactionCounter&&t.transactionCounter.acquisitionBudgetSpent)||0,
      starters, bench, salary:null,
      players: entries.map(e=>playerOf(e).id).filter(Boolean),
      _allPlayers: entries.map(e=>({ ...playerOf(e), slot: SLOT[e.lineupSlotId]||"", starter: SLOT[e.lineupSlotId]!=="BN"&&SLOT[e.lineupSlotId]!=="IR" })),
    };
  }

  // reuse the same analyzer contract Sleeper uses (lineup shapes + quirks + my-vs-league).
  // ESPN scoring/tx feeds differ, so we compute shapes + ranks and list the rest as skips.
  function analyze(teams, myId, week){
    const skips=[];
    const shapes = teams.map(t=>{ const c={}; t.starters.forEach(s=>{const p=s.player.pos; if(p)c[p]=(c[p]||0)+1;});
      const shapeKey=["QB","RB","WR","TE","K","DEF","DL","LB","DB"].filter(p=>c[p]).map(p=>c[p]+p).join(" ");
      return { roster_id:t.roster_id, teamName:t.teamName, counts:c, shapeKey, isMe:t.roster_id===myId }; });
    const sc={}; shapes.forEach(s=>sc[s.shapeKey]=(sc[s.shapeKey]||0)+1);
    const commonShape=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
    const unusual=shapes.filter(s=>sc[s.shapeKey]===1 && shapes.length>2);
    const quirks=[];
    ["QB","RB","WR","TE","K"].forEach(pos=>{ const wc=shapes.map(s=>({t:s.teamName,isMe:s.isMe,n:s.counts[pos]||0}));
      const max=Math.max(...wc.map(x=>x.n)); const top=wc.filter(x=>x.n===max&&max>0);
      if(top.length===1&&max>=2) quirks.push(`${top[0].t} is the only team starting ${max} ${pos}${top[0].isMe?" (you)":""}`); });
    // scoring this week (ESPN team.roster only carries current-period; points populate once played)
    let scoring=null;
    const anyPts = teams.some(t=>pf(t)>0);
    // my-vs-league
    let mine=null; const me=teams.find(t=>t.roster_id===myId);
    if(me){ const pfRank=teams.slice().sort((a,b)=>b.pf-a.pf).findIndex(t=>t.roster_id===myId)+1;
      const myShape=shapes.find(s=>s.roster_id===myId);
      mine={ pfRank, paRank: teams.slice().sort((a,b)=>b.pa-a.pa).findIndex(t=>t.roster_id===myId)+1,
        rosterSize: me.players.length, shape: myShape?myShape.shapeKey:"",
        movesRank: teams.slice().sort((a,b)=>b.moves-a.moves).findIndex(t=>t.roster_id===myId)+1 }; }
    skips.push("Weekly scoring / boom-bust / points-left-on-bench: populate once games are played (ESPN returns 0 pre-kickoff).");
    skips.push("FAAB spent + trade grading: ESPN exposes acquisition counts, not full FAAB ledgers; trade grading needs projections.");
    return { shapes, commonShape, unusual, quirks, scoring, tx:null, mine, skips, teamsCount:teams.length };
  }

  async function loadLeague(cfg, season){
    const url = `${CONFIG.espn.apiBase}?league=${encodeURIComponent(cfg.id)}&season=${encodeURIComponent(season)}`;
    const data = await getJSONraw(url);
    if(data && data.error){
      if(data.error==="espn_auth_expired") return { authExpired:true, name:cfg.name, leagueId:cfg.id };
      throw new Error(data.error + (data.message?(": "+data.message):""));
    }
    const settings = data.settings||{};
    const teamsRaw = data.teams||[];
    const teams = teamsRaw.map(t=>buildTeam(t, cfg.team));
    const myTeam = teams.find(t=>t.roster_id===cfg.team) || null;
    const week = data.scoringPeriodId || (data.status && data.status.currentMatchupPeriod) || 1;

    // matchup (mine) from schedule
    let matchup=null;
    if(myTeam){
      const cur = (data.status && data.status.currentMatchupPeriod) || week;
      const g = (data.schedule||[]).find(x=> x.matchupPeriodId===cur &&
        ((x.home&&x.home.teamId===cfg.team)||(x.away&&x.away.teamId===cfg.team)));
      if(g){
        const meHome = g.home && g.home.teamId===cfg.team;
        const meSide = meHome?g.home:g.away, oppSide = meHome?g.away:g.home;
        const oppTeam = oppSide ? teams.find(t=>t.roster_id===oppSide.teamId) : null;
        matchup = { me:{teamName:myTeam.teamName, points:(meSide&&meSide.totalPoints)||0},
                    opp: oppSide?{teamName:oppTeam?oppTeam.teamName:"Opp", points:oppSide.totalPoints||0}:null };
      }
    }
    const standings = teams.slice().sort((a,b)=>(b.record.w-a.record.w)||(b.pf-a.pf))
      .map((t,i)=>({ rank:i+1, teamName:t.teamName, owner:t.owner, w:t.record.w,l:t.record.l,t:t.record.t,
                     pf:t.pf, isMe: myTeam && t.roster_id===myTeam.roster_id }));
    const analyzer = analyze(teams, cfg.team, week);

    return {
      provider:"espn", leagueId:cfg.id, name:cfg.name, seasonWeek:week, roster_positions:[], salary:null,
      me: myTeam ? { teamName:myTeam.teamName, record:myTeam.record, pf:myTeam.pf, pa:myTeam.pa,
                     starters:myTeam.starters, bench:myTeam.bench, salary:null } : null,
      matchup, standings, teams, analyzer,
    };
  }

  async function load(){
    if(!CONFIG.espn.enabled) return { week:1, out:[] };
    const out=[]; let authExpired=false;
    // sequential to be gentle on the single cookie / rate limits
    for(const cfg of CONFIG.espn.leagues){
      try{
        const L = await loadLeague(cfg, CONFIG.espn.season);
        if(L.authExpired){ authExpired=true; out.push({ provider:"espn", leagueId:cfg.id, name:cfg.name, authExpired:true }); }
        else out.push(L);
      }catch(e){ out.push({ provider:"espn", leagueId:cfg.id, name:cfg.name, error:e.message }); }
    }
    const week = out.find(L=>L.seasonWeek)?.seasonWeek || 1;
    return { week, out, authExpired };
  }
  return { load };
})();

/* ============================================================================
   RENDER
   ============================================================================ */
function fmtPts(n){ return (Math.round((n||0)*100)/100).toFixed(2); }
function recStr(r){ return `${r.w}-${r.l}${r.t?("-"+r.t):""}`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function salChip(salary, pid){
  if(!salary) return "";
  const s = salary.byId[String(pid)];
  if(!s) return "";
  return s.known ? `<span class="psal">$${s.amt}</span>`
                 : `<span class="psal verify" title="No auction price (waiver/FA pickup) — floored to $${s.amt}. Verify.">$${s.amt}·?</span>`;
}

// ---- player image: headshot -> team logo -> initial (fallback chain) ----
// Headshot from ESPN CDN by espn player id; on error swap to the team logo
// (white chip, readable on dark bg); if that also fails, show a position-colored initial.
// Reuses the picks-site logo pattern. All fallbacks are client-side onerror swaps.
function headshotUrl(espnId){ return `https://a.espncdn.com/i/headshots/nfl/players/full/${espnId}.png`; }
function teamLogoUrl(team){ return `https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/${String(team).toLowerCase()}.png`; }
function playerImg(player){
  const name = player.name||"";
  const initial = esc((name.trim()[0]||"?").toUpperCase());
  const team = (player.team||"").toUpperCase();
  const pos = esc(player.pos||"");
  const fbInitial = `<span class="pimg-fb pos-${pos}" style="display:none">${initial}</span>`;
  // last-resort initial is always in the DOM (hidden); the logo <img> reveals it on error.
  const logoOnErr = team
    ? `onerror="this.onerror=null;this.src='${teamLogoUrl(team)}';this.classList.add('is-logo');this.dataset.f='logo';this.addEventListener('error',function(){this.style.display='none';var s=this.parentNode.querySelector('.pimg-fb');if(s)s.style.display='inline-flex';},{once:true});"`
    : `onerror="this.onerror=null;this.style.display='none';var s=this.parentNode.querySelector('.pimg-fb');if(s)s.style.display='inline-flex';"`;
  if(player.espnId){
    return `<span class="pimg-wrap"><img class="pimg" src="${headshotUrl(player.espnId)}" alt="" loading="lazy" ${logoOnErr}>${fbInitial}</span>`;
  }
  // no espn id -> skip straight to team logo (or initial if no team)
  if(team){
    return `<span class="pimg-wrap"><img class="pimg is-logo" src="${teamLogoUrl(team)}" alt="" loading="lazy" onerror="this.onerror=null;this.style.display='none';var s=this.parentNode.querySelector('.pimg-fb');if(s)s.style.display='inline-flex';">${fbInitial}</span>`;
  }
  return `<span class="pimg-wrap"><span class="pimg-fb pos-${pos}" style="display:inline-flex">${initial}</span></span>`;
}

function playerRow(slot, player, isBench, salary, reserve){
  const cls="pl"+(isBench?" bench":"");
  const slotLbl = reserve ? "IR/TX" : (isBench?"BN":slot);
  if(!player) return `<div class="${cls}"><span class="slot ${esc(slotLbl)}">${esc(slotLbl)}</span>`
    +`<span class="pimg-wrap empty"></span>`
    +`<span class="pname empty-slot">— empty —</span><span class="ppos"></span></div>`;
  const meta=[player.pos,player.team].filter(Boolean).join(" · ");
  const sal = salChip(salary, player.id);
  return `<div class="${cls}">
    <span class="slot ${esc(slotLbl)}">${esc(slotLbl)}</span>
    ${playerImg(player)}
    <span class="pname">${esc(player.name)} <span class="pmeta">${esc(meta)}</span></span>
    ${sal || `<span class="ppos pos-${esc(player.pos)}">${esc(player.pos||"")}</span>`}
  </div>`;
}

function rosterBlock(team, salary){
  const st = team.starters.map(s=>playerRow(s.slot,s.player,false,salary,false)).join("");
  const bn = team.bench.map(b=>playerRow("BN",b.player,true,salary,b.reserve)).join("") || `<div class="note" style="text-align:left">No bench.</div>`;
  let capLine="";
  if(team.salary){
    const pctv=Math.min(100,Math.round(team.salary.total/team.salary.cap*100));
    const over=team.salary.total>team.salary.cap;
    capLine=`<div class="lg-meta" style="margin-top:8px">Cap: <b style="color:${over?'var(--red)':'var(--gold)'}">$${team.salary.total}</b> / $${team.salary.cap}`
      +(team.salary.unknownCount?` · ${team.salary.unknownCount} floored/verify`:"")+`</div>
      <div class="capbar"><div class="fill ${over?'over':''}" style="width:${pctv}%"></div></div>`;
  }
  return `<div class="sh">Starters</div><div class="roster">${st}</div>
    <details class="more"><summary>Bench (${team.bench.length})</summary><div class="roster" style="margin-top:6px">${bn}</div></details>
    ${capLine}`;
}

function analyzerPane(A, L){
  if(!A) return `<div class="note">No analyzer data.</div>`;
  const s=[];
  // lineup shapes
  s.push(`<div class="sh">Roster construction (starting lineups)</div>`);
  s.push(`<div class="an-grid">`);
  s.push(`<div class="stat"><div class="k">Most common shape</div><div class="v">${esc(A.commonShape?A.commonShape[0]:"—")}</div><div class="d">${A.commonShape?A.commonShape[1]:0} of ${A.teamsCount} teams run this</div></div>`);
  const myShape=A.shapes.find(x=>x.isMe);
  s.push(`<div class="stat me"><div class="k">Your shape</div><div class="v">${esc(myShape?myShape.shapeKey:"—")}</div><div class="d">${myShape&&A.commonShape&&myShape.shapeKey!==A.commonShape[0]?"differs from the field":"matches the field"}</div></div>`);
  s.push(`</div>`);
  if(A.quirks.length) s.push(`<div class="an-note">🔍 `+A.quirks.map(esc).join(" · ")+`</div>`);
  if(A.unusual.length) s.push(`<div class="an-note">⚠️ Unusual lineups: `+A.unusual.map(u=>esc(u.teamName)+" ("+esc(u.shapeKey)+")").join(", ")+`</div>`);

  // scoring
  if(A.scoring){
    s.push(`<div class="sh">Scoring this week</div><div class="an-grid">`);
    s.push(`<div class="stat"><div class="k">Top scorer</div><div class="v">${esc(A.scoring.top.teamName)}</div><div class="d">${fmtPts(A.scoring.top.points)} pts</div></div>`);
    s.push(`<div class="stat"><div class="k">Most pts on bench</div><div class="v">${esc(A.scoring.mostOnBench.teamName)}</div><div class="d">${fmtPts(A.scoring.mostOnBench.benchPts)} left on bench</div></div>`);
    if(A.scoring.me){ s.push(`<div class="stat me"><div class="k">You scored</div><div class="v">${fmtPts(A.scoring.me.points)}</div><div class="d">${fmtPts(A.scoring.me.benchPts)} on your bench</div></div>`); }
    s.push(`</div>`);
  }

  // transactions / FAAB
  if(A.tx){
    s.push(`<div class="sh">Transactions & FAAB</div><div class="an-grid">`);
    s.push(`<div class="stat"><div class="k">Total moves</div><div class="v">${A.tx.totalMoves}</div><div class="d">${A.tx.adds} adds · ${A.tx.trades} trades (season)</div></div>`);
    if(A.tx.busiest) s.push(`<div class="stat"><div class="k">Most active</div><div class="v">${esc(A.tx.busiest.teamName)}</div><div class="d">${A.tx.busiest.moves} moves${A.tx.busiest.isMe?" (you)":""}</div></div>`);
    s.push(`</div>`);
    if(A.tx.faabBudget!=null){
      s.push(`<details class="more"><summary>FAAB spent (of $${A.tx.faabBudget})</summary><div style="margin-top:6px">`);
      A.tx.faab.forEach(f=>{ s.push(`<div class="an-row"><span class="lab">${esc(f.teamName)}${f.isMe?" (you)":""}</span><span class="val">$${f.spent}${f.left!=null?` · $${f.left} left`:""}</span></div>`); });
      s.push(`</div></details>`);
    }
  }

/* ============================================================================
   CROSS-LEAGUE VIEWS (Sleeper + ESPN)
   ============================================================================ */
// NFL weekly schedule (opponent + kickoff) from ESPN's PUBLIC scoreboard (no auth).
// Keyed by team abbrev -> { opp, kickoff(iso), dayTime }. TBD when unavailable (never faked).
// Live NFL week from Sleeper's state endpoint (auto-advances through the season). No auth.
async function loadNflState(){
  try{ const s = await getJSONraw("https://api.sleeper.app/v1/state/nfl");
    return { week: s.week||1, season: s.season||String(new Date().getFullYear()), seasonType: s.season_type||"regular" };
  }catch(e){ return { week:1, season:String(new Date().getFullYear()), seasonType:"regular" }; }
}

// Parse one scoreboard competitor's game status into a normalized shape.
// state ∈ {pre, in, post}; we also keep the display detail + score for rendering.
function parseGameStatus(ev){
  const t = (ev.status && ev.status.type) || {};
  const state = t.state || "pre";                    // pre | in | post
  const detail = t.shortDetail || t.detail || "";    // e.g. "Final", "Q3 4:12", "Sun 1:00 PM ET"
  return { state, detail, completed: !!t.completed };
}

// NFL schedule for a SPECIFIC week (single-sourced from the live week so the label + games match).
// seasontype: 1=pre, 2=regular, 3=post. Captures opponent, kickoff, status, and score.
// Honesty: anything the feed doesn't provide stays null/TBD — never fabricated.
async function loadNflSchedule(season, week, seasonType){
  const st = seasonType==="post" ? 3 : (seasonType==="pre" ? 1 : 2);
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard`
            + `?seasontype=${st}&week=${encodeURIComponent(week||1)}&dates=${encodeURIComponent(season)}`;
  try{
    const d = await getJSONraw(url);
    const map={};
    (d.events||[]).forEach(ev=>{
      const c=(ev.competitions&&ev.competitions[0])||{}; const comp=c.competitors||[];
      const home=comp.find(x=>x.homeAway==="home"), away=comp.find(x=>x.homeAway==="away");
      if(!home||!away) return;
      const ha=home.team.abbreviation, aa=away.team.abbreviation, iso=ev.date;
      const gs = parseGameStatus(ev);
      const hs = (home.score!=null)?Number(home.score):null, as_ = (away.score!=null)?Number(away.score):null;
      // per-team record: opponent, kickoff, status, and this team's/opp's score
      map[ha]={ opp:"vs "+aa, kickoff:iso, state:gs.state, statusDetail:gs.detail, completed:gs.completed, teamScore:hs, oppScore:as_, oppAbbr:aa };
      map[aa]={ opp:"@ "+ha, kickoff:iso, state:gs.state, statusDetail:gs.detail, completed:gs.completed, teamScore:as_, oppScore:hs, oppAbbr:ha };
    });
    return map;
  }catch(e){ return {}; }
}
function fmtKick(iso){
  if(!iso) return "TBD";
  const d=new Date(iso); if(isNaN(d)) return "TBD";
  try{ return new Intl.DateTimeFormat("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"}).format(d); }
  catch(e){ return "TBD"; }
}
function dayKey(iso){ if(!iso) return "TBD"; const d=new Date(iso); if(isNaN(d)) return "TBD";
  try{ return new Intl.DateTimeFormat("en-US",{weekday:"long",month:"short",day:"numeric"}).format(d); }catch(e){ return "TBD"; } }

// ---- league priority order (user-defined; applies to cards + all-my-players) ----
// Yahoo leagues (KFL #4, Guillotine #10) aren't loaded yet but are slotted for when they are.
const LEAGUE_PRIORITY = [
  "can am", "royal crushers", "busch apple salary dynasty", "kfl",
  "uncle and boys", "2qb / winona", "dargelong", "6-man",
  "the soup kitchen", "guillotine",
];
function leagueRank(name){
  const n = String(name||"").trim().toLowerCase();
  // exact match first, then a loose contains-match so minor name variations still slot correctly
  let i = LEAGUE_PRIORITY.indexOf(n);
  if(i<0) i = LEAGUE_PRIORITY.findIndex(k => n.includes(k) || k.includes(n));
  return i<0 ? 999 : i;
}
function sortByPriority(leagues){
  return leagues.slice().sort((a,b)=>{
    const r = leagueRank(a.name)-leagueRank(b.name);
    return r!==0 ? r : String(a.name||"").localeCompare(String(b.name||""));
  });
}

// ---- game-window classification (from kickoff ISO, US Eastern) ----
// Buckets map to when lineups get set. Anything unscheduled -> Other/TBD (never faked).
const WINDOW_ORDER = [
  "Thursday Night", "Sunday Morning / Intl", "Sunday Early (1:00 ET)",
  "Sunday Late Afternoon", "Sunday Night", "Monday Night", "Other / TBD / Bye",
];
function classifyWindow(iso){
  if(!iso) return "Other / TBD / Bye";
  const d = new Date(iso); if(isNaN(d)) return "Other / TBD / Bye";
  // Convert to US Eastern parts (handles EDT/EST) via Intl, avoiding local-tz drift.
  let dow, hour, min;
  try{
    const parts = new Intl.DateTimeFormat("en-US",{ timeZone:"America/New_York",
      weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false }).formatToParts(d);
    dow = parts.find(p=>p.type==="weekday").value;      // Thu / Sun / Mon ...
    hour = parseInt(parts.find(p=>p.type==="hour").value,10);
    min = parseInt(parts.find(p=>p.type==="minute").value,10);
  }catch(e){ return "Other / TBD / Bye"; }
  const t = hour*60 + min; // minutes since ET midnight
  if(dow==="Thu") return "Thursday Night";
  if(dow==="Mon") return "Monday Night";
  if(dow==="Sun"){
    if(t < 12*60)        return "Sunday Morning / Intl";      // before noon ET (e.g. 9:30 London)
    if(t < 15*60)        return "Sunday Early (1:00 ET)";     // ~1:00 pm slot
    if(t < 18*60+15)     return "Sunday Late Afternoon";      // 4:05 / 4:25 pm
    return "Sunday Night";                                     // 8:20 SNF
  }
  return "Other / TBD / Bye"; // Fri/Sat/holiday specials -> honest catch-all
}

// D1 — every rostered player across ALL leagues, deduped, w/ which leagues + this week's game.
function buildAllMyPlayers(allLeagues, sched){
  const byPlayer={}; // key: name|pos|team -> {name,pos,team, leagues:Set, kickoff}
  allLeagues.forEach(L=>{
    if(!L.me) return;
    const mine = [...(L.me.starters||[]).map(s=>({...s.player, starter:true})),
                  ...(L.me.bench||[]).map(b=>({...b.player, starter:false}))].filter(p=>p&&p.name);
    mine.forEach(p=>{
      const key = (p.name||"").toLowerCase()+"|"+(p.pos||"");
      const rec = byPlayer[key] || (byPlayer[key]={ name:p.name, pos:p.pos, team:p.team, leagues:new Set(), startSet:new Set(), starterIn:0, total:0 });
      rec.leagues.add(L.name); rec.total++; if(p.starter){ rec.starterIn++; rec.startSet.add(L.name); }
      if(!rec.team && p.team) rec.team=p.team;
    });
  });
  const list = Object.values(byPlayer).map(r=>{
    const g = r.team ? sched[r.team] : null;
    // leagues this player is on, in the user's priority order
    const lgs = [...r.leagues].sort((a,b)=> leagueRank(a)-leagueRank(b) || String(a).localeCompare(String(b)));
    return { ...r, leagues:lgs, startSet:r.startSet, oppText:(g?g.opp:"TBD"), kickoff:(g?g.kickoff:null),
             gstate:(g?g.state:null), statusDetail:(g?g.statusDetail:null), completed:(g?!!g.completed:false),
             teamScore:(g&&g.teamScore!=null?g.teamScore:null), oppScore:(g&&g.oppScore!=null?g.oppScore:null) };
  });
  // tag each player with its game window + matchup key (used for grouping)
  list.forEach(p=>{ p.window = classifyWindow(p.kickoff); });
  // keep the flat list so future filter modes can regroup without a refetch
  return { list, count:list.length };
}

// group the flat list by game window, in the fixed lineup-setting order (empty buckets skipped)
function groupByWindow(list){
  const groups={};
  list.forEach(p=>{ (groups[p.window]=groups[p.window]||[]).push(p); });
  const order = WINDOW_ORDER.filter(w=>groups[w]);
  order.forEach(w=> groups[w].sort((a,b)=>
    ((a.kickoff&&b.kickoff)?(new Date(a.kickoff)-new Date(b.kickoff)):0) || a.name.localeCompare(b.name)));
  return { groups, order };
}

// game status chip: Final (w/ score) · LIVE (w/ score) · kickoff time · TBD. Never fabricated.
function gameStatusChip(p){
  if(!p.kickoff && !p.gstate) return `<span class="gst tbd">TBD</span>`;
  const score = (p.teamScore!=null && p.oppScore!=null) ? ` ${p.teamScore}–${p.oppScore}` : "";
  if(p.gstate==="post" || p.completed) return `<span class="gst final" title="Final">✓ Final${esc(score)}</span>`;
  if(p.gstate==="in")                  return `<span class="gst live" title="${esc(p.statusDetail||"In progress")}">● LIVE${esc(score)}</span>`;
  return `<span class="gst pre">${esc(fmtKick(p.kickoff))}</span>`; // scheduled
}
// is this player's game still upcoming (for the "Upcoming only" filter)?
function isUpcoming(p){ return !(p.gstate==="post" || p.completed || p.gstate==="in"); }

function ampPlayerRow(p){
  const leaguesLbl = p.leagues.length>1 ? `${p.leagues.length} leagues` : (p.leagues[0]||"—");
  // expanded body: each league this player is on (priority order), ▶ marks where you START them
  const startSet = p.startSet || new Set();
  const lgLines = p.leagues.map(name=>{
    const starts = startSet.has ? startSet.has(name) : false;
    return `<div class="pl-lg">${starts?`<span class="pl-start" title="You start them here">▶ START</span>`:`<span class="pl-bench">bench</span>`}<span>${esc(name)}</span></div>`;
  }).join("");
  const played = (p.gstate==="post"||p.completed) ? " is-played" : "";
  return `<details class="pl-d${played}">
    <summary class="pl">
      <span class="slot pos-${esc(p.pos)}" style="background:#0d131c">${esc(p.pos||"?")}</span>
      ${playerImg(p)}
      <span class="pname">${esc(p.name)} <span class="pmeta">${esc(p.team||"FA")} · ${esc(p.oppText)} · ${gameStatusChip(p)}</span></span>
      <span class="ppos">${esc(leaguesLbl)}${p.starterIn?` · ▶${p.starterIn}`:""} <span class="pl-caret">▾</span></span>
    </summary>
    <div class="pl-body">${lgLines}</div>
  </details>`;
}

// module-level toggle state for All My Players
let AMP_UPCOMING_ONLY = false;
let AMP_DATA = null;

function renderAllMyPlayers(data, week){
  AMP_DATA = data;

// D2 — available players per league. Honest signals only (trending-adds + position need); no fake score.
// Sleeper: leaguewide trending-adds (who's hot) + which are NOT rostered in THIS league.
let SLEEPER_TREND=null, SLEEPER_PMAP=null;
async function loadSleeperTrending(){
  if(SLEEPER_TREND) return SLEEPER_TREND;
  try{
    const t = await getJSON("https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=100");
    SLEEPER_TREND = t||[]; return SLEEPER_TREND;
  }catch(e){ SLEEPER_TREND=[]; return []; }
}
function myPositionNeed(L){
  // count my starters by pos; flag positions where I'm thin relative to the league's typical starters
  if(!L.me) return {};
  const c={}; (L.me.starters||[]).forEach(s=>{const p=s.player&&s.player.pos; if(p)c[p]=(c[p]||0)+1;});
  const bench={}; (L.me.bench||[]).forEach(b=>{const p=b.player&&b.player.pos; if(p)bench[p]=(bench[p]||0)+1;});
  // "thin" = position with <=1 bench backup at RB/WR/TE/QB
  const need={};
  ["QB","RB","WR","TE"].forEach(p=>{ if((bench[p]||0)<=1) need[p]=true; });
  return need;
}

async function boot(){

  const errors=[];

  // 1) resolve the live NFL week FIRST (single source), so the schedule + label always match.
  const nfl = await loadNflState();
  // 2) load providers + the week-scoped schedule in parallel.
  const [sleeperRes, espnRes, sched] = await Promise.all([
    providers.sleeper.load().catch(e=>{ errors.push("Sleeper: "+e.message); return {week:nfl.week,out:[]}; }),
    CONFIG.espn.enabled ? providers.espn.load().catch(e=>{ errors.push("ESPN: "+e.message); return {week:nfl.week,out:[]}; }) : Promise.resolve({week:nfl.week,out:[]}),
    loadNflSchedule(nfl.season, nfl.week, nfl.seasonType),
  ]);

  // labeled week comes from the single NFL-state source (auto-advances)
  const week = nfl.week;
  // order by user-defined league priority everywhere (cards + all-my-players)
  const allLeagues = sortByPriority([...sleeperRes.out, ...espnRes.out]);

  if(errors.length) eb.innerHTML = `<div class="err">${errors.map(esc).join("<br>")}</div>`; else eb.innerHTML="";
  if(espnRes.authExpired) eb.innerHTML += `<div class="err">🔑 ESPN session expired — refresh the cookie in Vercel env vars (see the ESPN cards below).</div>`;

  // shell w/ top tabs
  box.innerHTML = crossTabsShell();
  document.getElementById("tt-leagues").innerHTML = allLeagues.map((L,i)=>leagueCard(L,i)).join("") || `<div class="note">No leagues loaded.</div>`;

  // D1 — all my players (built from whatever loaded). Week is single-sourced from NFL state.
  const amp = buildAllMyPlayers(okLeagues, sched);

  function paintAMP(){
    document.getElementById("tt-players").innerHTML =
      `<div class="card">${renderAllMyPlayers(amp, AMP_WEEK)}
       <div class="an-skip" style="margin-top:12px"><b>Note:</b> week auto-tracks the live NFL week; opponent/kickoff/score come from the NFL scoreboard for that week. Players on a bye or an unscheduled game show <b>TBD</b> (never guessed). Final scores/live status appear once games start.</div></div>`;
  }
  paintAMP();
  window.__paintAMP = paintAMP; // used by the "Upcoming only" toggle handler

  // D2 — available / pickups (Sleeper leagues use trending-adds + rostered-set; ESPN gets a note)
  const trending = await loadSleeperTrending();
  document.getElementById("tt-avail").innerHTML = renderAvailable(sleeperRes.out, espnRes.out, trending);

    "Sleeper via public API · ESPN via a secure serverless proxy (cookie stays server-side) · schedule from ESPN public scoreboard.";
}

function renderAvailable(sleeperLeagues, espnLeagues, trending){
  const s=[];
  s.push(`<div class="card"><div class="an-skip"><b>What this is:</b> a "who's available + trending + where you're thin" list — <b>not a projection</b>. Ranking = leaguewide trending adds (Sleeper) + your position needs. Scoring-based ranking fills in once games are played.</div></div>`);
  // build a trending lookup (player_id -> add count) + resolve names from the Sleeper cache
  const trendCount={}; (trending||[]).forEach(t=>trendCount[String(t.player_id)]=t.count);
  let pmap=null; try{ pmap=JSON.parse(localStorage.getItem("sleeper_players_nfl_v2")||"null"); }catch(e){}

  sortByPriority(sleeperLeagues).forEach(L=>{
    if(!L.me || !L.teams) return;
    const rostered=new Set(); L.teams.forEach(t=>(t.players||[]).forEach(pid=>rostered.add(String(pid))));
    const need = myPositionNeed(L);
    // available trending = trending players not rostered in THIS league
    const avail = (trending||[]).filter(t=>!rostered.has(String(t.player_id)))
      .map(t=>{ const p=pmap?pmap[String(t.player_id)]:null;
        return { name:p?p.n:("#"+t.player_id), pos:p?p.p:"", team:p?p.t:"", espnId:p?(p.e||""):"", adds:t.count, needFlag: p&&need[p.p] }; })
      .filter(x=>x.pos)
      .sort((a,b)=> (b.needFlag-a.needFlag) || (b.adds-a.adds))
      .slice(0,15);
    const needStr = Object.keys(need).length? `You're thin at: <b>${Object.keys(need).join(", ")}</b>` : "Roster looks balanced";
    s.push(`<div class="card"><div class="lg-head"><span class="lg-name">${esc(L.name)} ${providerTag(L)}</span></div>
      <div class="lg-meta">${needStr} · top available by trending adds (24h)</div>
      <div class="roster" style="margin-top:8px">`
      + (avail.length? avail.map(a=>`<div class="pl">
          <span class="slot pos-${esc(a.pos)}" style="background:#0d131c">${esc(a.pos)}</span>
          ${playerImg(a)}
          <span class="pname">${esc(a.name)} <span class="pmeta">${esc(a.team||"FA")}${a.needFlag?" · fills a need":""}</span></span>
          <span class="ppos" title="added in ${a.adds} leagues in last 24h">+${a.adds} 🔥</span>
        </div>`).join("")
        : `<div class="note" style="text-align:left">No trending free agents right now.</div>`)
      + `</div></div>`);
  });

  // ESPN leagues — honest note (free-agent view is a heavier authed call; wired next iteration)
  if(espnLeagues.some(L=>L.me)){
    s.push(`<div class="card"><div class="lg-head"><span class="lg-name">ESPN leagues ${'' }</span></div>
      <div class="an-skip"><b>ESPN pickups:</b> ESPN's free-agent pool needs a separate authed players query through the proxy. The trending-adds signal above is leaguewide (works for players available in your ESPN leagues too — cross-reference by name). A per-ESPN-league available list is the next iteration.</div></div>`);
  }
  return s.join("");
}

// "Upcoming only" toggle on All My Players — re-render that pane in place
document.addEventListener("change", e=>{
  if(e.target && e.target.id==="ampUpcoming"){
    AMP_UPCOMING_ONLY = e.target.checked;
    if(window.__paintAMP) window.__paintAMP();
  }
});

// top-level tab switching
document.addEventListener("click", e=>{
  const tt=e.target.closest("#topTabs .tab"); if(!tt) return;
  const which=tt.dataset.tt;
  document.querySelectorAll("#topTabs .tab").forEach(x=>x.classList.toggle("active", x===tt));
  ["leagues","players","avail"].forEach(k=>{ const el=document.getElementById("tt-"+k); if(el) el.style.display = (k===which)?"":"none"; });
  window.scrollTo({top:0,behavior:"smooth"});
});

boot();
</script>
